<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Stock Trading Amount Calculator</title>


<!--
ref: https://www.futuhk.com/en/commissionnew

Item    Fees    Charged by
Commission    $0.0049/Share, minimum $0.99/order    FUTU HK
Fixed platform fees    $0.005/Share, minimum $1/order    FUTU HK
Tiered platform fees (Accumlated monthly shares)    Fees per share (minimum $1/order)    FUTU HK
1-500th shares    $0.0100
501-1,000th shares    $0.0080
1,001-5,000th shares    $0.0070
5,001-10,000th shares    $0.0060
10,001-50,000th shares    $0.0055
50,001-200,000th shares    $0.0050
200,001-500,000th shares    $0.0045
500,001-1,000,000th shares    $0.0040
1,000,001-5,000,000th shares    $0.0035
5,000,001st shares and above    $0.0030
Settlement Fees    $0.003/Share    U.S. Settlement Agency
SEC fees    $0.0000206 * transaction amount, min $0.01/trade    SEC
Trading Activity Fees    $0.000195/Share, min $0.01/Trade, max $9.79/Trade    FINRA
Consolidated Audit Trail Fees
NMS Stocks：$0.000003/Share
OTC Stocks：$0.00000003/Share    FINRA
-->


<style>
    body {
        font-family: Arial, sans-serif;
        margin: 15px;
        font-size: 14px;
    }

    h2 {
        text-align: center;
    }

    .input-group {
        margin-bottom: 12px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 20ch;
        max-width: 100%;
        padding: 6px;
        font-size: 15px;
        box-sizing: border-box;
    }

    button {
        display: block;
        margin-top: 10px;
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
    }

    .table-wrapper {
        margin-top: 20px;
        max-height: 360px;
        overflow-y: auto;
        overflow-x: auto;
        border: 1px solid #ccc;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1400px;
        font-size: 13px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 6px;
        text-align: right;
        white-space: nowrap;
    }

    th {
        background-color: #f0f0f0;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    td:first-child, th:first-child {
        text-align: center;
    }

    .buy {
        background-color: #e8f7ff;
    }

    .sell {
        background-color: #fff7e6;
    }

    /* Target table cells on hover to override .buy / .sell classes */
    tbody tr:hover td {
        background-color: #e2e2e2 !important; 
        cursor: pointer;
    }
</style>
</head>

<body>

<h2>US Stock Trading Amount Calculator</h2>

<div class="input-group">
    <label>Price</label>
    <input type="number" id="price" step="0.01">
</div>

<div class="input-group">
    <label>Quantity</label>
    <input type="number" id="qty">
</div>

<div class="input-group">
    <label>Bid Size</label>
    <input type="number" id="bidsize" step="0.01"
           onkeydown="if(event.key === 'Enter'){ calculate(); }">
</div>

<button onclick="calculate()">Calculate</button>

<div class="table-wrapper">
<table id="resultTable">
    <thead>
        <tr>
            <th>Price</th>
            <th>Qty</th>
            <th>G/L HKD</th>
            <th>BidSize</th>
            <th>Consideration</th>
            <th>Commission</th>
            <th>Platform</th>
            <th>Settlement</th>
            <th>SEC</th>
            <th>Trading</th>
            <th>OtherTotal</th>
            <th>TotalAmount</th>
            <th>GainLoss(%)</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</div>

<script>
function roundUp2(num) {
    return Math.ceil(num * 100) / 100;
}

function calculate() {
    const price = parseFloat(document.getElementById("price").value);
    const qty = parseInt(document.getElementById("qty").value);
    const bidSize = parseFloat(document.getElementById("bidsize").value);

    if (!price || !qty || !bidSize) {
        alert("Please enter all inputs");
        return;
    }

    const rows = 100;
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    let buyTotalAmount = 0;

    for (let i = 0; i < rows; i++) {
        const tradePrice = (i === 0) ? price : price + bidSize * i;
        const consideration = tradePrice * qty;

        const commission = Math.max(qty * 0.0049, 0.99);
        const platform = Math.max(qty * 0.005, 1);
        const settlement = roundUp2(qty * 0.003);

        let sec = 0;
        if (i !== 0) {
            sec = roundUp2(Math.max(consideration * 0.0000206, 0.01));
        }

        let trading = 0;
        if (i !== 0) {
            trading = qty * 0.000195;
            trading = Math.min(Math.max(trading, 0.01), 9.79);
            trading = roundUp2(trading);
        }

        const otherTotal = commission + platform + settlement + sec + trading;

        let totalAmount;
        if (i === 0) {
            totalAmount = consideration + otherTotal;
            buyTotalAmount = totalAmount;
        } else {
            totalAmount = consideration - otherTotal;
        }

        const gainLossUSD = (i === 0) ? 0 : (totalAmount - buyTotalAmount);
        const gainLossHKD = gainLossUSD * 7.8;
        const gainLossPct = (i === 0) ? 0 : (gainLossUSD / buyTotalAmount) * 100;

        const tr = document.createElement("tr");
        tr.className = (i === 0) ? "buy" : "sell";

        tr.innerHTML = `
            <td>${tradePrice.toFixed(2)}</td>
            <td>${qty}</td>
            <td>${gainLossHKD.toFixed(2)}</td>
            <td>${bidSize.toFixed(2)}</td>
            <td>${consideration.toFixed(2)}</td>
            <td>${commission.toFixed(2)}</td>
            <td>${platform.toFixed(2)}</td>
            <td>${settlement.toFixed(2)}</td>
            <td>${sec.toFixed(2)}</td>
            <td>${trading.toFixed(2)}</td>
            <td>${otherTotal.toFixed(2)}</td>
            <td>${totalAmount.toFixed(2)}</td>
            <td>${gainLossPct.toFixed(2)}%</td>
        `;

        tbody.appendChild(tr);
    }
}
</script>

</body>
</html>
