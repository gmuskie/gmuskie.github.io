    :root {
        --bg: #05070b;
        --panel: #101826;
        --panel-strong: #121a2b;
        --border: #2b3a4d;
        --text: #f3f4f6;
        --muted: #d1d5db;
        --header: #1f2937;
        --input: #0b1220;
        --buy: rgba(39, 125, 161, 0.35);
        --sell: rgba(185, 120, 12, 0.35);
        --hover: rgba(148, 163, 184, 0.2);
    }

    body {
        font-family: Arial, sans-serif;
        margin: 15px;
        font-size: 14px;
        background-color: var(--bg);
        color: var(--text);
    }

    h2 {
        text-align: center;
        color: var(--text);
    }

    .input-group {
        margin-bottom: 12px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: var(--muted);
    }

    input {
        width: 20ch;
        max-width: 100%;
        padding: 6px;
        font-size: 15px;
        box-sizing: border-box;
        background-color: var(--input);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
    }

    button {
        display: block;
        margin-top: 10px;
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
        background: #111827;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
    }

    .table-wrapper, .bottom-section {
        margin-top: 20px;
        max-height: 60vh;
        overflow-y: auto;
        overflow-x: auto;
        border: 1px solid var(--border);
        background-color: var(--panel);
        color: var(--text);
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1200px;
        font-size: 13px;
        background-color: var(--panel-strong);
        color: var(--text);
    }

    th, td {
        border: 1px solid var(--border);
        padding: 6px;
        text-align: right;
        white-space: nowrap;
        color: var(--text);
    }

    th {
        background-color: var(--header);
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    td:first-child, th:first-child {
        text-align: center;
    }

    .buy { background-color: var(--buy); }
    .sell { background-color: var(--sell); }
    tbody tr:hover td { background-color: var(--hover) !important; cursor: pointer; }
    th:first-child { position: sticky; left: 5; background-color: var(--header); font-weight: bold; z-index: 0; }
</style>
</head>
<body>

<h2>JP</h2>

<div class="input-group">
    <label>Price</label>
    <input type="number" id="price" step="any" onclick="clearField(this)">
</div>

<div class="input-group">
    <label>Quantity</label>
    <input type="number" id="qty" onclick="clearField(this)" onkeydown="if (event.key === 'Enter') { event.preventDefault(); main(event); }">
</div>

<div class="input-group">
    <label>BidSize (override)</label>
    <input type="number" id="bidsize" step="any" value="1" onclick="clearField(this)">
</div>

<div class="input-group">
    <label>xRate (JPY => HKD)</label>
    <input type="number" id="xRate" disabled>
</div>

<button onclick="main(event)">Calculate</button>

<div class="table-wrapper" aria-hidden="true"></div>

<script>
    // JP-specific variables and formula functions preserved
    var price, qty, bidSize, consideration, buyTotalAmount, sellTotalAmount, el_containerDiv, xRate;
    const apiUrl = `https://open.er-api.com/v6/latest/JPY`;

    async function fetchExchangeRate() {
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        xRate = data && data.rates && data.rates.HKD ? data.rates.HKD : 0.055;
      } catch (err) {
        xRate = 0.055; // fallback
      }
      var xRateInput = document.getElementById('xRate');
      if (xRateInput) xRateInput.value = xRate;
    }

    function setTable() {
      var previousTable = document.getElementById("mainTable"); if (previousTable) previousTable.remove();
      var previousBottomSection = document.getElementById("bottom-section"); if (previousBottomSection) previousBottomSection.remove();
      var el_bottomDiv = document.createElement("div"); el_bottomDiv.id = "bottom-section"; el_bottomDiv.classList.add("bottom-section");

      var tHeader = ["","Price", "Qty", "G/L HKD", "BidSize", "Consideration","Commission", "Platform",
              "Settlement", "SEC", "Trading", "OtherTotal", "TotalJPY=>HKD", "GainLoss(%)"]; 

      var sellId = ["s_title","s_Price", "s_Qty", "s_GL_HKD", "s_BidSize", "s_Consideration", "s_Platform","s_Commission",
                    "s_Settlement","s_SEC","s_Trading", "s_OtherTotal", "s_TotalAmount", "s_GainLoss"];

      var el_table = document.createElement("table"); el_table.id = "mainTable"; el_table.classList.add("mainTable");
      var thead = document.createElement("thead"); var tr = document.createElement("tr");

      var consideration = price * qty;
      var otherFee = getOtherFee(price, qty, "buy")
      buyTotalAmount = consideration + otherFee.total;
      buyTotalAmountHKD = (consideration + otherFee.total) * xRate;

      var tBody = [["Buy", fmtDecimal(price), fmtNoDecimal(qty), fmtDecimal(0), fmtNoDecimal(bidSize), fmtNoDecimal(consideration),
                    fmtNoDecimal(otherFee.commission), fmtNoDecimal(otherFee.platform), fmtNoDecimal(otherFee.settlement), fmtNoDecimal(0),
                    fmtNoDecimal(0), fmtNoDecimal(otherFee.total), fmtNoDecimal(buyTotalAmount) + " => " + fmtNoDecimal(buyTotalAmountHKD), "0"]];

      var maxRow = 500;
      var curBuyPrice = price;
      var curSellPrice = price + bidSize;

      for (var i = 0; i < tHeader.length; i++) { var th = document.createElement("th"); th.textContent = tHeader[i]; tr.appendChild(th); }
      thead.appendChild(tr); el_table.appendChild(thead);

      for (var i = 0; i < tBody.length; i++) {
        var row = document.createElement("tr");
        for (var j = 0; j < tBody[i].length; j++) {
          var el_td = document.createElement("td"); if (i == 1) el_td.setAttribute('id', sellId[j]);
          el_td.textContent = tBody[i][j]; el_td.style.textAlign = "right"; row.appendChild(el_td);
        }
        el_table.appendChild(row);
      }

      JPYtoHKD = xRate;
      for (var i = 0; i <= maxRow; i++) {
        consideration = curSellPrice * qty;
        otherFee = getOtherFee(curSellPrice, qty, "sell");
        sellTotalAmount = consideration - otherFee.total;
        sellTotalAmountHKD = (consideration - otherFee.total) * xRate;
        gl = sellTotalAmount - buyTotalAmount;
        glPcent = (curSellPrice - price) / price * 100;
        var tSellBody = ["Sell", fmtDecimal(curSellPrice), fmtNoDecimal(qty), fmtDecimal(gl * JPYtoHKD), fmtNoDecimal(bidSize), fmtNoDecimal(consideration),
                          fmtNoDecimal(otherFee.commission), fmtNoDecimal(otherFee.platform), fmtNoDecimal(otherFee.settlement), fmtDecimal(0), fmtDecimal(0),
                          fmtNoDecimal(otherFee.total), fmtNoDecimal(sellTotalAmount) + " => " + fmtNoDecimal(sellTotalAmountHKD), fmtNoDecimal(gl) + " (" + fmtDecimal(glPcent) + ")"];

        var row = document.createElement("tr");
        for (var j = 0; j < tSellBody.length; j++) {
          var el_td = document.createElement("td"); if (i == 1) el_td.setAttribute('id', sellId[j]); el_td.textContent = tSellBody[j]; el_td.style.textAlign = "right"; row.appendChild(el_td);
        }
        el_table.appendChild(row);
        curSellPrice += bidSize;
      }

      el_bottomDiv.appendChild(el_table);
      document.body.appendChild(el_bottomDiv);
    }

    function main(e) {
      if (e && e.preventDefault) e.preventDefault();
      var xr = document.getElementById("xRate"); if (xr) xr.value = xRate;
      price = parseFloat(document.getElementById("price").value);
      qty = parseFloat(document.getElementById("qty").value);
      bidSize = parseFloat(document.getElementById("bidsize").value);
      consideration = price * qty;
      setTable();
    }

    // JP formula functions unchanged
    function fmtDecimal(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtNoDecimal(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
    function getBidSize(price) {
      var bidSize = 0;
      if (price <= 3000) { bidSize = 1; }
      else if (price <= 5000) { bidSize = 5; }
      else if (price <= 30000) { bidSize = 10; }
      else if (price <= 50000) { bidSize = 50; }
      else if (price <= 300000) { bidSize = 100; }
      else if (price <= 500000) { bidSize = 500; }
      else if (price <= 3000000) { bidSize = 1000; }
      else if (price <= 5000000) { bidSize = 5000; }
      else if (price <= 30000000) { bidSize = 10000; }
      else if (price <= 50000000) { bidSize = 50000; }
      else if (price > 50000000) { bidSize = 100000; }
      return bidSize;
    }
    function getCost(price, qty, bs) { var consideration = price * qty; var otherFee = getOtherFee(price, qty, bs); return (bs == "buy") ? (consideration + otherFee.total) : (consideration - otherFee.total); }
    function ceilToDecimalPlaces(num, decimalPlaces) { const factor = Math.pow(10, decimalPlaces); return Math.ceil(num * factor) / factor; }
    function getOtherFee(price, qty, bs) {
      var commission_rate = 0.0008; var fixed_platform = 180; var settlement = 40; var otherFee = {};
      otherFee.platform = fixed_platform; otherFee.settlement = settlement;
      otherFee.commission = ceilToDecimalPlaces(commission_rate * (qty * price), 0);
      if (otherFee.commission < 80) otherFee.commission = 80;
      otherFee.total = otherFee.commission + otherFee.platform + otherFee.settlement; return otherFee;
    }

    function setCursorFocus() { var inputField = document.getElementById("price"); if (inputField) inputField.focus(); }
    function handleKeyPress(event) { if (event.key === 'Enter') { event.preventDefault(); main(event); } }
    function clearField(inputField) { inputField.value = ''; }

    document.addEventListener('DOMContentLoaded', function() {
      var qtyField = document.getElementById('qty'); if (qtyField) qtyField.addEventListener('keydown', handleKeyPress);
      fetchExchangeRate(); setCursorFocus();
    });
</script>

</body>
